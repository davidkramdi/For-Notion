&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&#x27;cq-interactive-map&#x27;);
  const inputs = [root.querySelector(&#x27;#cq-b1&#x27;), root.querySelector(&#x27;#cq-b2&#x27;), root.querySelector(&#x27;#cq-b3&#x27;)];
  const scenario = root.querySelector(&#x27;#cq-scenario&#x27;);
  const grid = root.querySelector(&#x27;#cq-grid&#x27;);
  const timeline = root.querySelector(&#x27;#cq-timeline&#x27;);
  const detail = root.querySelector(&#x27;#cq-detail&#x27;);

  function counts() {
    return [Number(inputs[0].value), Number(inputs[1].value), Number(inputs[2].value), ...Array(13).fill(1500)];
  }

  function renderGrid() {
    const values = counts();
    grid.replaceChildren(...values.map((bytes, index) =&gt; {
      const q = index + 1;
      const item = document.createElement(&#x27;div&#x27;);
      item.className = &#x27;cq-queue&#x27;;
      if (scenario.value === &#x27;empty&#x27; &amp;&amp; q === 2) item.classList.add(&#x27;is-empty&#x27;);
      if (scenario.value === &#x27;hol&#x27; &amp;&amp; q === 3) item.classList.add(&#x27;is-problem&#x27;);
      if (scenario.value === &#x27;delay&#x27; &amp;&amp; q &gt;= 13) item.classList.add(&#x27;is-waiting&#x27;);
      const title = document.createElement(&#x27;strong&#x27;);
      title.textContent = &#x27;Q&#x27; + q;
      const value = document.createElement(&#x27;span&#x27;);
      value.textContent = bytes;
      item.append(title, value);
      return item;
    }));
  }

  function update() {
    inputs.forEach((input, index) =&gt; root.querySelector(&#x27;#cq-b&#x27; + (index + 1) + &#x27;v&#x27;).textContent = input.value);
    const values = counts();
    const total = values.reduce((sum, value) =&gt; sum + value, 0);
    const q1Share = (values[0] / total * 100).toFixed(1);
    root.querySelector(&#x27;#cq-formula&#x27;).textContent = `Q1 : ${values[0]} / ${total} = ${q1Share} % lorsque toutes les files sont actives`;
    const messages = {
      normal:[&#x27;Répartition indirecte&#x27;,&#x27;Le pourcentage n’est pas configuré directement : il résulte du ratio entre chaque byte-count et leur somme.&#x27;],
      empty:[&#x27;File vide&#x27;,&#x27;Q2 est simplement sautée. Il n’y a ni attente ni redistribution calculée : les autres files utilisent immédiatement le lien.&#x27;],
      hol:[&#x27;Head-of-line blocking&#x27;,&#x27;Q3 reste FIFO : un gros paquet placé en tête retarde tous les paquets situés derrière lui, même un petit paquet sensible au délai.&#x27;],
      delay:[&#x27;Délai de tour&#x27;,&#x27;Des byte-counts élevés dans les premières files allongent le cycle. Les queues 13 à 16 attendent davantage avant d’être visitées.&#x27;]
    }[scenario.value];
    detail.querySelector(&#x27;strong&#x27;).textContent = messages[0];
    detail.querySelector(&#x27;span&#x27;).textContent = messages[1];
    renderGrid();
  }

  function addSlot(label, q, skipped = false) {
    const slot = document.createElement(&#x27;span&#x27;);
    slot.className = &#x27;cq-slot&#x27; + (skipped ? &#x27; is-skip&#x27; : &#x27;&#x27;);
    slot.dataset.q = String(q);
    slot.textContent = label;
    timeline.append(slot);
  }

  function runCycle() {
    timeline.replaceChildren();
    addSlot(&#x27;Q0&#x27;, 0);
    addSlot(&#x27;Q0&#x27;, 0);
    addSlot(&#x27;Q0&#x27;, 0);
    counts().forEach((bytes, index) =&gt; {
      const q = index + 1;
      if (scenario.value === &#x27;empty&#x27; &amp;&amp; q === 2) {
        addSlot(&#x27;Q2 vide&#x27;, q, true);
        return;
      }
      const visits = Math.max(1, Math.round(bytes / 1500));
      for (let i = 0; i &lt; visits; i++) addSlot(&#x27;Q&#x27; + q, q);
    });
  }

  inputs.forEach(input =&gt; input.addEventListener(&#x27;input&#x27;, update));
  scenario.addEventListener(&#x27;change&#x27;, () =&gt; { timeline.replaceChildren(); update(); });
  root.querySelector(&#x27;#cq-run&#x27;).addEventListener(&#x27;click&#x27;, runCycle);
  root.querySelector(&#x27;#cq-clear&#x27;).addEventListener(&#x27;click&#x27;, () =&gt; timeline.replaceChildren());
  update();
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);

    } else {

    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));

    if (openTimeout != null) {

      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();

    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
