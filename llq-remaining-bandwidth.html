    (() =&gt; {
      const root = document.getElementById(&#x27;llq-remaining-bandwidth&#x27;);
      const voiceInput = root.querySelector(&#x27;#lr-voice-demand&#x27;);
      const dataInput = root.querySelector(&#x27;#lr-data-demand&#x27;);
      const capacity = 100;
      const llqLimit = 20;

      function setText(id,text) { root.querySelector(id).textContent = text; }

      function render() {
        const voiceDemand = Number(voiceInput.value);
        const dataDemand = Number(dataInput.value);
        const congested = voiceDemand + dataDemand &gt; capacity;
        let voiceSent;
        let dataSent;

        if (!congested) {
          voiceSent = voiceDemand;
          dataSent = dataDemand;
        } else {
          voiceSent = Math.min(voiceDemand,llqLimit);
          dataSent = Math.min(dataDemand,capacity - voiceSent);
        }

        const totalSent = voiceSent + dataSent;
        const voiceLoss = Math.max(0,voiceDemand - voiceSent);
        const dataLoss = Math.max(0,dataDemand - dataSent);
        setText(&#x27;#lr-voice-demand-label&#x27;,voiceDemand + &#x27; Mbps&#x27;);
        setText(&#x27;#lr-data-demand-label&#x27;,dataDemand + &#x27; Mbps&#x27;);
        setText(&#x27;#lr-voice-demand-out&#x27;,voiceDemand + &#x27; Mbps&#x27;);
        setText(&#x27;#lr-data-demand-out&#x27;,dataDemand + &#x27; Mbps&#x27;);
        setText(&#x27;#lr-voice-sent&#x27;,voiceSent + &#x27; Mbps&#x27;);
        setText(&#x27;#lr-data-sent&#x27;,dataSent + &#x27; Mbps&#x27;);
        setText(&#x27;#lr-utilisation&#x27;,totalSent + &#x27;% utilised&#x27;);
        root.querySelector(&#x27;#lr-voice-fill&#x27;).style.width = Math.min(100,voiceDemand / 80 * 100) + &#x27;%&#x27;;
        root.querySelector(&#x27;#lr-data-fill&#x27;).style.width = Math.min(100,dataDemand / 140 * 100) + &#x27;%&#x27;;
        root.querySelector(&#x27;#lr-link-voice&#x27;).style.width = voiceSent + &#x27;%&#x27;;
        root.querySelector(&#x27;#lr-link-data&#x27;).style.width = dataSent + &#x27;%&#x27;;

        let status;
        if (!congested) {
          status = &#x27;&lt;strong&gt;No congestion:&lt;/strong&gt; both classes send everything they offer; the 20% LLQ value is not a permanent partition.&#x27;;
        } else if (voiceLoss &gt; 0) {
          status = &#x27;&lt;strong&gt;Congestion:&lt;/strong&gt; Voice is held to the 20 Mbps LLQ reference and other traffic uses the remaining &#x27; + dataSent + &#x27; Mbps.&#x27;;
        } else if (dataLoss &gt; 0) {
          status = &#x27;&lt;strong&gt;Congestion:&lt;/strong&gt; Voice is served first and class-default receives the remaining &#x27; + dataSent + &#x27; Mbps.&#x27;;
        } else {
          status = &#x27;&lt;strong&gt;At capacity:&lt;/strong&gt; all offered traffic fits exactly on the link.&#x27;;
        }
        root.querySelector(&#x27;#lr-status&#x27;).innerHTML = status;
        root.querySelector(&#x27;#lr-summary&#x27;).setAttribute(&#x27;aria-label&#x27;,&#x27;On a 100 megabit link, &#x27; + voiceDemand + &#x27; megabits of voice demand results in &#x27; + voiceSent + &#x27; megabits sent, and &#x27; + dataDemand + &#x27; megabits of other traffic demand results in &#x27; + dataSent + &#x27; megabits sent.&#x27;);
      }

      voiceInput.addEventListener(&#x27;input&#x27;,render);
      dataInput.addEventListener(&#x27;input&#x27;,render);
      render();
